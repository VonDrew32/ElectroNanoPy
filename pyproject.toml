[project]
name = "electronanopy"
version = "1.0.0"
description = "Plataforma para caracterización, visualización y análisis de propiedades estructurales, electrónicas y estabilidad dinámica de nanomateriales (salidas de VASP)."
requires-python = ">=3.10"
dependencies = ["pymatgen", "numpy", "matplotlib", "phonopy", "seekpath", "scipy", "scikit-image", "PySide6-Essentials"]

[project.scripts]
electronanopy = "electronanopy.app.main_window:run"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
