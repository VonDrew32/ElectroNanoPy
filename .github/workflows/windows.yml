name: Construir ejecutable de Windows
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyinstaller
      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Construir
        run: pyinstaller packaging/electronanopy.spec --noconfirm
      - name: Resumen desde el ejecutable de consola
        run: .\dist\ElectroNanoPy\ElectroNanoPy-consola.exe --resumen tests\data\grafeno_5x5
      - uses: actions/upload-artifact@v4
        with:
          name: ElectroNanoPy-windows
          path: dist/ElectroNanoPy
